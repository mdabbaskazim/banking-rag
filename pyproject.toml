[project]
name = "bankrag"
version = "0.1.0"
description = "Production-grade Banking RAG with verified claims and human-in-the-loop"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "structlog>=24.4.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.3",
    "psycopg[binary,pool]>=3.2.3",
    "qdrant-client>=1.12.0",
    "google-genai>=2.34.0,<3.0.0",
    "tenacity>=9.0.0",
]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "pyright>=1.1.385",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "hypothesis>=6.115.0",
    "httpx>=0.27.2",
    "pre-commit>=4.0.1",
    "poethepoet>=0.29.0",
]
eval = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bankrag"]

[tool.poe.tasks]
lint = "ruff check src tests scripts"
format-check = "ruff format --check src tests scripts"
format = "ruff format src tests scripts"
types = "pyright"
test = "pytest"
check = ["lint", "format-check", "types", "test"]
dev = "uvicorn bankrag.api.main:app --reload --port 8000"

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "RUF", # ruff-specific rules
]
ignore = []

[tool.pyright]
include = ["src", "tests", "scripts"]
venvPath = "."
venv = ".venv"
pythonVersion = "3.12"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "integration: integration tests requiring external database or services",
    "smoke: end-to-end smoke tests requiring real cloud credentials",
]
addopts = "-m 'not integration and not smoke'"

